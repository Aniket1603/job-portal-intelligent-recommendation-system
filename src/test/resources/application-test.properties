# =============================================================================
# Test overrides — used by all @SpringBootTest and @WebMvcTest tests
# Never use a real MySQL database during tests.
# =============================================================================

# H2 in-memory database replaces MySQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT test values — NOT real secrets; safe for test use only
jwt.secret=test-secret-key-for-unit-tests-only-minimum-32-bytes-ok
jwt.expiration=3600000

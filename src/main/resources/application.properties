spring.application.name=job-portal-backend

# =============================================================================
# DATABASE — values are supplied via environment variables (never hardcoded)
# Required env vars:  DB_URL  |  DB_USERNAME  |  DB_PASSWORD
# Example:
#   DB_URL=jdbc:mysql://localhost:3306/job_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#   DB_USERNAME=root
#   DB_PASSWORD=yourpassword
# =============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# JPA / HIBERNATE
# NOTE: ddl-auto=update is suitable for development only.
# Replace with 'validate' (or 'none') when proper Flyway/Liquibase migrations
# are introduced for production in a later phase.
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================================================
# JWT — Phase 2
# Required env vars:  JWT_SECRET  |  JWT_EXPIRATION (optional, ms, default 24h)
# Example:
#   JWT_SECRET=<generate with: openssl rand -base64 64>
#   JWT_EXPIRATION=86400000
# NEVER commit actual JWT_SECRET values.
# =============================================================================
# WARNING: The default below is for LOCAL DEVELOPMENT ONLY.
# In production / staging, always set JWT_SECRET as an environment variable.
# Generate a strong secret with: openssl rand -base64 64
jwt.secret=${JWT_SECRET:dev-local-secret-key-NOT-for-production-use-minimum-32-bytes-ok!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================================================
# SPRING BOOT ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized

# =============================================================================
# LOGGING
# =============================================================================
logging.level.com.jobportal=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
